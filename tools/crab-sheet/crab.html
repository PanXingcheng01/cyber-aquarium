<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>螃蟹怎么画</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #061417;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="1080" height="420"></canvas>
    <script>
      // 把螃蟹的两种姿态按鱼缸里的样子画出来（放大 6 倍），给说明书当插图
      const cv = document.getElementById('c')
      const ctx = cv.getContext('2d')
      const CO = { body: '#ff7a45', claw: '#ffb36b', leg: '#c2643c', eye: '#ffe9a8', eyeDim: '#c9a06a' }

      function fontFor(cellW) {
        ctx.font = '100px Consolas, "Cascadia Mono", "Courier New", monospace'
        const advance = Math.max(0.4, ctx.measureText('M').width / 100)
        return `${(cellW / advance).toFixed(2)}px Consolas, "Cascadia Mono", "Courier New", monospace`
      }

      function drawRow(ox, oy, cellW, cellH, cells) {
        ctx.font = fontFor(cellW)
        for (let i = 0; i < cells.length; i++) {
          const ch = cells[i][0]
          const color = cells[i][1]
          if (ch === ' ') continue
          const x = ox + i * cellW + cellW / 2
          const y = oy + cellH / 2
          ctx.shadowColor = color
          ctx.shadowBlur = Math.max(4, cellW * 0.45)
          ctx.fillStyle = color
          ctx.fillText(ch, x, y)
          ctx.shadowBlur = 0
          ctx.fillText(ch, x, y)
        }
      }

      const CLAWS_AWAKE = [
        ['V', CO.claw], [' ', ''], [' ', ''], ['.', CO.eye], [' ', ''], ['.', CO.eye], [' ', ''], [' ', ''], ['V', CO.claw],
      ]
      const CLAWS_ASLEEP = [
        ['>', CO.claw], [' ', ''], [' ', ''], ['-', CO.eyeDim], [' ', ''], ['-', CO.eyeDim], [' ', ''], [' ', ''], ['<', CO.claw],
      ]
      const SHELL = [
        ['_', CO.leg], ['/', CO.leg], ['(', CO.body], ['_', CO.body], ['^', CO.body], ['_', CO.body], [')', CO.body],
        ['\\', CO.leg], ['_', CO.leg],
      ]
      const FEET = [
        [' ', ''], [' ', ''], ['v', CO.leg], [' ', ''], [' ', ''], [' ', ''], ['v', CO.leg], [' ', ''], [' ', ''],
      ]

      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'

      const bg = ctx.createLinearGradient(0, 0, 0, cv.height)
      bg.addColorStop(0, '#0c2226')
      bg.addColorStop(1, '#061417')
      ctx.fillStyle = bg
      ctx.fillRect(0, 0, cv.width, cv.height)

      // 沙线
      ctx.strokeStyle = 'rgba(130,250,220,0.30)'
      ctx.lineWidth = 2
      ctx.beginPath()
      for (let x = 0; x <= cv.width; x += 8) {
        const y = 330 + Math.sin(x * 0.012) * 6 + Math.sin(x * 0.03) * 3
        if (x === 0) ctx.moveTo(x, y)
        else ctx.lineTo(x, y)
      }
      ctx.stroke()

      const cw = 40
      const ch = 64

      drawRow(120, 96, cw, ch, CLAWS_AWAKE)
      drawRow(120, 96 + ch, cw, ch, SHELL)
      drawRow(120, 96 + ch * 2, cw, ch, FEET)

      drawRow(700, 96 + ch, cw, ch, CLAWS_ASLEEP)
      drawRow(700, 96 + ch * 2, cw, ch, SHELL)

      ctx.fillStyle = '#9ffcff'
      ctx.font = '700 26px "Microsoft YaHei", sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText('醒着：钳子抬着，两只脚分开站', 300, 390)
      ctx.fillText('睡着：蹲下、收脚、钳子合上', 880, 390)
    </script>
  </body>
</html>
